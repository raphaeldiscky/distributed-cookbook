# kind cluster config for the envoy-gateway recipe.
#
# Default kindnet CNI + default kube-proxy — no special bootstrap. The
# envoy-gateway helm chart (installed by Tilt) will install Gateway API
# CRDs + envoy-gateway's own CRDs, then register the `eg` GatewayClass.
#
# extraPortMappings forward the Envoy data plane to host:8082.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cookbook-envoy-gateway
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8082
        protocol: TCP
