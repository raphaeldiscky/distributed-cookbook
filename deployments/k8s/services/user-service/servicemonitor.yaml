# Tells the Prometheus Operator (installed by kube-prometheus-stack) to
# scrape user-service's /metrics endpoint. Recipes that want this
# service's metrics include this base via kustomize.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  labels:
    app: user-service
    cookbook.service: user-service
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: { app: user-service }
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
