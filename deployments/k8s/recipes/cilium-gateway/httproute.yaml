# Routes /users/* → user-service and /products/* → catalog-service.
# Same shape as the envoy-gateway recipe's HTTPRoute — only parentRefs
# differs (single-gateway-per-recipe, production-realistic topology).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cilium-gateway-route
spec:
  parentRefs:
    - name: cilium-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /users }
      backendRefs:
        - name: user-service
          port: 80
    - matches:
        - path: { type: PathPrefix, value: /products }
      backendRefs:
        - name: catalog-service
          port: 80
