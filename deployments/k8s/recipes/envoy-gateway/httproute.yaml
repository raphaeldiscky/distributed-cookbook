# Routes /users/* → user-service and /products/* → catalog-service.
# Single gateway per recipe — production-realistic topology. The
# cilium-gateway recipe ships an equivalent route with parentRefs
# pointing at its own Gateway resource; comparing the two is done
# across separate runs of each recipe.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-gateway-route
spec:
  parentRefs:
    - name: envoy-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /users }
      backendRefs:
        - name: user-service
          port: 80
    - matches:
        - path: { type: PathPrefix, value: /products }
      backendRefs:
        - name: catalog-service
          port: 80
