services:
  postgres:
    image: postgres:18.3-alpine3.22
    container_name: cookbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
      POSTGRES_DB: cookbook_db
    ports:
      - "5433:5432"
    volumes:
      # Mount at /var/lib/postgresql, NOT /var/lib/postgresql/data. Since 18 the
      # official images keep the cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so pg_upgrade --link works within a
      # single mount point, and they refuse to boot when they find a volume at
      # the old /data path. See docker-library/postgres#1259.
      - pg_data:/var/lib/postgresql
    networks:
      - distributed-cookbook
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook -d cookbook_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:

networks:
  distributed-cookbook:
    external: true
