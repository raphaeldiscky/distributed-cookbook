services:
  redis:
    image: redis:8.4.2-alpine3.22
    container_name: cookbook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - distributed-cookbook
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:

networks:
  distributed-cookbook:
    external: true
