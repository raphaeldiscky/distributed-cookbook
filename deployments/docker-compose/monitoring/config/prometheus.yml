global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Recipe app running on host via `task run`
  - job_name: recipe-app
    static_configs:
      - targets:
          - host.docker.internal:8081  # flashsale
        labels:
          recipe: flashsale

  # OTel Collector self-metrics + app metrics relayed via collector
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # k6 uses remote_write (see K6_PROMETHEUS_RW_SERVER_URL in taskfile.yml).
  # Prometheus's --web.enable-remote-write-receiver accepts it at /api/v1/write.
  # No scrape target needed.
