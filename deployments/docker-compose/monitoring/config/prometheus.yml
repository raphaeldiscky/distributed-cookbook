global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Recipe app running on host via `task run`
  - job_name: recipe-app
    static_configs:
      - targets:
          - host.docker.internal:8081  # flashsale
        labels:
          recipe: flashsale

  # OTel Collector self-metrics + app metrics relayed via collector
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # k6 prometheus pull endpoint (when --out experimental-prometheus-rw is used,
  # k6 also exposes /metrics on :6565 if started with --out=prometheus)
  - job_name: k6
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:6565"]
