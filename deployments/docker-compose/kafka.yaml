# Single-node Kafka in KRaft mode (no ZooKeeper).
#
# One node acting as both broker and controller, which is the smallest thing that
# still speaks the real Kafka protocol. Recipes get honest partition ordering and
# consumer groups; what they do not get is replication, because a single broker
# cannot lose a follower.
#
# Two listeners: PLAINTEXT on 9092 for containers on the shared bridge, and
# PLAINTEXT_HOST on 9094 for apps running on the host. `task run` builds a host
# binary, so 9094 is the one recipes actually connect to.
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: cookbook-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft: this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node, so nothing can be replicated. The default of 3 would leave
      # every internal topic under-replicated and wedge consumer groups.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Deliberately small. This box also runs Postgres, Redis, the recipe server
      # and k6, and the JVM will take a quarter of available RAM if left alone.
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - distributed-cookbook
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  kafka_data:

networks:
  distributed-cookbook:
    external: true
